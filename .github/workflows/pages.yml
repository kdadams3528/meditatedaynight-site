name: Fetch images and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Archive product images from Shopify CDN into the repo (one-time)
        run: |
          mkdir -p assets/images
          base=https://cdn.shopify.com/s/files/1/0808/7948/4971/files
          for f in scripture-wallet-cards-grid.jpg scripture-wallet-covers-band.jpg scripture-wallet-covers-cards-fanned.jpg scripture-wallet-cards-stack.jpg; do
            [ -s assets/images/$f ] || curl -fsSL "$base/$f" -o assets/images/$f || true
          done
          if [ -n "$(git status --porcelain assets/images)" ]; then
            git config user.name github-actions; git config user.email github-actions@users.noreply.github.com
            git add assets/images && git commit -m "Archive product images from Shopify CDN [skip ci]" && git push
          fi
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
